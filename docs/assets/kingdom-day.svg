<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#70d7ff"/>
      <stop offset="0.48" stop-color="#b8ebff"/>
      <stop offset="1" stop-color="#e8faff"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ab9d2"/>
      <stop offset="1" stop-color="#4f7f9b"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8aa4"/>
      <stop offset="1" stop-color="#24566c"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72c986"/>
      <stop offset="1" stop-color="#2f7f57"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5bc7e8"/>
      <stop offset="1" stop-color="#0b70a5"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#a4c9df"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <circle cx="1510" cy="180" r="92" fill="#fff6b9" opacity=".92" filter="url(#glow)"/>
  <circle cx="1510" cy="180" r="150" fill="#fffbe0" opacity=".22" filter="url(#soft)"/>

  <g fill="#ffffff" opacity=".78">
    <ellipse cx="300" cy="205" rx="150" ry="42"/>
    <ellipse cx="420" cy="195" rx="105" ry="34"/>
    <ellipse cx="1015" cy="170" rx="135" ry="36"/>
    <ellipse cx="1120" cy="184" rx="95" ry="28"/>
  </g>

  <path d="M0 635 L235 390 L380 520 L610 280 L830 510 L1030 330 L1290 545 L1510 360 L1920 620 L1920 760 L0 760 Z"
        fill="url(#mountainBack)" opacity=".72"/>
  <path d="M0 715 L300 485 L475 650 L760 420 L1000 650 L1260 475 L1490 660 L1730 500 L1920 655 L1920 825 L0 825 Z"
        fill="url(#mountainFront)" opacity=".95"/>

  <path d="M0 725 Q350 650 620 735 Q930 830 1250 715 Q1590 610 1920 735 L1920 1080 L0 1080 Z"
        fill="url(#meadow)"/>

  <path d="M250 880 Q650 770 940 805 Q1230 840 1670 760 Q1540 930 1210 1010 Q770 1110 250 1040 Z"
        fill="url(#water)" opacity=".86"/>
  <path d="M340 900 Q700 815 990 845 Q1230 870 1510 815" fill="none" stroke="#c8f7ff" stroke-width="7" opacity=".35"/>

  <!-- Castle -->
  <g transform="translate(1180 470)" fill="url(#castle)" stroke="#6aa7c4" stroke-width="4">
    <rect x="80" y="150" width="300" height="185" rx="8"/>
    <rect x="22" y="105" width="100" height="230" rx="8"/>
    <rect x="338" y="95" width="110" height="240" rx="8"/>
    <rect x="185" y="52" width="98" height="283" rx="8"/>
    <path d="M15 108 L72 30 L129 108 Z"/>
    <path d="M330 98 L393 12 L456 98 Z"/>
    <path d="M175 55 L234 -34 L293 55 Z"/>
    <path d="M80 152 L230 78 L380 152 Z" opacity=".96"/>
    <g fill="#397ca0" stroke="none">
      <rect x="207" y="210" width="54" height="125" rx="27"/>
      <rect x="52" y="160" width="26" height="52" rx="13"/>
      <rect x="382" y="150" width="28" height="57" rx="14"/>
      <rect x="218" y="103" width="28" height="56" rx="14"/>
      <rect x="131" y="195" width="30" height="54" rx="15"/>
      <rect x="310" y="190" width="30" height="54" rx="15"/>
    </g>
  </g>

  <g fill="#ffffff" opacity=".65">
    <circle cx="170" cy="720" r="5"/><circle cx="214" cy="668" r="3"/>
    <circle cx="530" cy="730" r="4"/><circle cx="660" cy="694" r="3"/>
    <circle cx="890" cy="744" r="4"/><circle cx="1040" cy="688" r="5"/>
    <circle cx="1450" cy="690" r="4"/><circle cx="1605" cy="730" r="3"/>
  </g>

  <rect width="1920" height="1080" fill="url(#sky)" opacity=".05"/>
</svg>